[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    ci_smoke: database-backed API check included in the fast CI run
    db_independent: test opens a separate database session or worker
    db_transaction_boundary: test asserts behavior across separate database transactions
filterwarnings =
    error::DeprecationWarning
