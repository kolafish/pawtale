name: Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/test-backend.sh"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: paradedb/paradedb:0.26.2
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/pawtale_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/pawtale_test
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # The image preloads PostGIS demo schemas into template1 and POSTGRES_DB.
      # Exercise Alembic against an empty database, including extension installation.
      - name: Create dedicated databases for both pytest workers
        run: |
          for worker in gw0 gw1; do
            docker exec "${{ job.services.postgres.id }}" createdb -U postgres -T template0 "test_${worker}_pawtale_test"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app embedding_service tests scripts
      - name: Full backend test suite
        run: python -m pytest -q -n 2 --dist worksteal --max-worker-restart=0 tests
